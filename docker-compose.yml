services:
  mysql:
    image: mysql:8.0
    container_name: smartcampus-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smartcampus_db
      MYSQL_USER: smartcampus
      MYSQL_PASSWORD: smartcampus
    ports:
      - "3306:3306"
    volumes:
      - smartcampus_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - smartcampus

  backend:
    build:
      context: ./SmartCampus-backend
      dockerfile: Dockerfile
    container_name: smartcampus-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smartcampus_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    networks:
      - smartcampus

  frontend:
    build:
      context: ./SmartCampus-frontend
      dockerfile: Dockerfile
    container_name: smartcampus-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - smartcampus

networks:
  smartcampus:

volumes:
  smartcampus_mysql_data:
